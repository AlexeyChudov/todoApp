stages: [build]

variables:
  IMAGE_TAG: ${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}

buildx-publish:
  stage: build
  image: docker:24-cli
  services:
    - name: docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create build || true
    - docker context use build
    - docker run --privileged --rm tonistiigi/binfmt --install all
    # Создать билдера Buildx
    - docker buildx create --use --name multiarch --driver docker-container
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --pull \
        --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache \
        --cache-to type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache,mode=max \
        --tag "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" \
        --tag "${CI_REGISTRY_IMAGE}:latest" \
        --push \
        .
    - docker buildx imagetools inspect "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
  after_script:
    - docker buildx rm multiarch || true
  rules:
    - if: '$CI_COMMIT_TAG'      # теги запускаются автоматически
      when: always
    - if: '$CI_COMMIT_BRANCH'   # пуши по ветке: пайплайн создаётся, job manual
      when: manual
  tags:
    - aarch64
    - arm64


