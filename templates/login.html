{{define "content"}}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="text-center">Вход</h3>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="username-email" class="form-label">Имя пользователя или Email</label>
                    <input type="text" class="form-control" id="username-email" name="username_email" placeholder="Введите имя пользователя или email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            <div class="text-center mt-3">
                <a href="/forgot-password">Забыли пароль?</a>
            </div>
        </div>
    </div>
</div>

{{end}}
